<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRE Assistant | DevOps Automation Helper</title>
    <style>
        :root {
            --primary-color: #0069ff;
            --primary-dark: #0050d8;
            --secondary-color: #00c7d4;
            --bg-color: #f8f9fa;
            --sidebar-bg: #0f1b2d;
            --chat-bg: #ffffff;
            --text-color: #1a202c;
            --text-light: #4a5568;
            --border-color: #e2e8f0;
            --code-bg: #f7fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar styles */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: white;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
        }

        .new-chat-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--primary-dark);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .chat-item {
            padding: 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
        }

        .chat-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .chat-item.active {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
            font-size: 0.875rem;
            opacity: 0.7;
        }

        /* Main content styles */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--chat-bg);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            margin-right: 1rem;
        }

        .model-selector {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .model-dropdown {
            padding: 0.5rem;
            border-radius: 0.375rem;
            border: 1px solid var(--border-color);
            background-color: white;
            font-size: 0.875rem;
            cursor: pointer;
        }

        /* Chat container styles */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .welcome-container {
            text-align: center;
            max-width: 600px;
            margin: 4rem auto;
            padding: 2rem;
            border-radius: 0.5rem;
            background-color: var(--chat-bg);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .welcome-title {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .welcome-subtitle {
            font-size: 1.125rem;
            margin-bottom: 2rem;
            color: var(--text-light);
        }

        .example-queries {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .example-query {
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: left;
        }

        .example-query:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .message {
            display: flex;
            gap: 1rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 0 1rem;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
            font-size: 0.875rem;
        }

        .user-avatar {
            background-color: var(--primary-color);
            color: white;
        }

        .assistant-avatar {
            background-color: var(--secondary-color);
            color: white;
        }

        .message-content {
            flex: 1;
            padding-top: 0.25rem;
            line-height: 1.6;
        }

        pre {
            background-color: var(--code-bg);
            padding: 1rem;
            border-radius: 0.375rem;
            overflow-x: auto;
            margin: 1rem 0;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 0.875rem;
            border: 1px solid var(--border-color);
        }

        code {
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            background-color: var(--code-bg);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }

        .message ul, .message ol {
            margin-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .message p {
            margin-bottom: 0.75rem;
        }

        .message h3 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            display: none;
        }

        .pre-container {
            position: relative;
        }

        .pre-container:hover .copy-btn {
            display: block;
        }

        /* Input container styles */
        .input-container {
            padding: 1rem 1.5rem 1.5rem;
            display: flex;
            justify-content: center;
            background-color: var(--bg-color);
            position: relative;
        }

        .input-box {
            display: flex;
            max-width: 900px;
            width: 100%;
            position: relative;
            border-radius: 0.75rem;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        textarea {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.875rem 3.5rem 0.875rem 1rem;
            resize: none;
            font-size: 1rem;
            line-height: 1.5;
            background-color: var(--chat-bg);
            min-height: 56px;
            max-height: 200px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 105, 255, 0.2);
        }

        .send-btn {
            position: absolute;
            right: 0.75rem;
            bottom: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: var(--primary-dark);
        }

        .send-btn:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
        }

        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .dots {
            display: flex;
            gap: 0.25rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--primary-color);
            animation: pulse 1.5s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
        }

        /* Error message styles */
        .error-message {
            background-color: #fff5f5;
            color: #e53e3e;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.875rem;
            border: 1px solid #feb2b2;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 50;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle {
                display: block;
            }

            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 40;
                display: none;
            }

            .overlay.open {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo-container">
            <div class="logo">SRE Assistant</div>
        </div>
        <button class="new-chat-btn" id="new-chat">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New chat
        </button>
        <div class="chat-history" id="chat-history">
            <!-- Chat history will be dynamically populated -->
        </div>
        <div class="sidebar-footer">
            <div>DevOps & SRE Automation Helper</div>
            <div style="font-size: 0.75rem; margin-top: 0.5rem;">Powered by DigitalOcean</div>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>
    <div class="main">
        <div class="top-bar">
            <button class="menu-toggle" id="menu-toggle">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="chat-container" id="chat-container">
            <div class="welcome-container">
                <h1 class="welcome-title">SRE Assistant</h1>
                <p class="welcome-subtitle">Your DevOps automation and scripting expert</p>
                <p>Ask me to create Python or Bash scripts for your SRE and DevOps workflows. I can help with monitoring, automation, deployment, and more.</p>
                <div class="example-queries">
                    <button class="example-query">Create a bash script to monitor CPU and memory usage on Linux servers</button>
                    <button class="example-query">Write a Python script to automate AWS EC2 instance backups</button>
                    <button class="example-query">Generate a Kubernetes pod health check script</button>
                    <button class="example-query">Create a Docker container cleanup script for stale images</button>
                </div>
            </div>
        </div>
        <div class="input-container">
            <div class="input-box">
                <textarea id="user-input" placeholder="Ask about Python or Bash scripts for DevOps and SRE..."></textarea>
                <button class="send-btn" id="send-btn" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM elements
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const newChatBtn = document.getElementById('new-chat');
        const chatHistory = document.getElementById('chat-history');
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('overlay');
        const exampleQueries = document.querySelectorAll('.example-query');

        // API configuration
        const API_ENDPOINT = 'https://rxnl6a3sqxrgj5u7z6u3bw2e.agents.do-ai.run/api/v1/chat/completions';
        const API_TOKEN = 'RnBRXWz5i3g1bUUAuJptqDxP2o40p4Yn'; // Replace with your actual token
        
        // Chat state
        let conversationId = generateId();
        let messageHistory = [];
        let chatHistoryList = [];
        let isGenerating = false;

        // Helper functions
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2);
        }

        function formatTimestamp() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Format code blocks with syntax highlighting
        function formatMessage(content) {
            // Simple markdown-like formatting
            let formatted = content;
            
            // Replace code blocks
            formatted = formatted.replace(/```([\s\S]*?)```/g, function(match, code) {
                const languageMatch = code.match(/^(\w+)\n/);
                let language = '';
                let codeContent = code;
                
                if (languageMatch) {
                    language = languageMatch[1];
                    codeContent = code.replace(/^\w+\n/, '');
                }
                
                return `<div class="pre-container">
                    <pre><code>${escapeHtml(codeContent)}</code></pre>
                    <button class="copy-btn">Copy</button>
                </div>`;
            });
            
            // Replace inline code
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Replace bold text
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Replace italic text
            formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // Replace headers
            formatted = formatted.replace(/### (.*?)\n/g, '<h3>$1</h3>');
            
            // Replace line breaks with paragraphs
            formatted = '<p>' + formatted.replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>') + '</p>';
            
            return formatted;
        }

        // Add user message to the chat
        function addUserMessage(content) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            messageElement.innerHTML = `
                <div class="avatar user-avatar">U</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            
            if (chatContainer.querySelector('.welcome-container')) {
                chatContainer.innerHTML = '';
            }
            
            chatContainer.appendChild(messageElement);
            scrollToBottom();
            
            messageHistory.push({
                role: 'user',
                content: content
            });
        }

        // Add assistant message to the chat
        function addAssistantMessage(content) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            messageElement.innerHTML = `
                <div class="avatar assistant-avatar">AI</div>
                <div class="message-content">${formatMessage(content)}</div>
            `;
            
            chatContainer.appendChild(messageElement);
            scrollToBottom();
            
            messageHistory.push({
                role: 'assistant',
                content: content
            });
            
            // Setup copy buttons for code blocks
            setupCopyButtons();
        }

        // Add loading indicator while waiting for response
        function addLoadingIndicator() {
            const loadingElement = document.createElement('div');
            loadingElement.className = 'message';
            loadingElement.id = 'loading-indicator';
            loadingElement.innerHTML = `
                <div class="avatar assistant-avatar">AI</div>
                <div class="message-content">
                    <div class="loading-indicator">
                        <div class="dots">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                        <span>Generating response...</span>
                    </div>
                </div>
            `;
            
            chatContainer.appendChild(loadingElement);
            scrollToBottom();
        }

        // Remove loading indicator
        function removeLoadingIndicator() {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (loadingIndicator) {
                loadingIndicator.remove();
            }
        }

        // Show error message
        function showError(message) {
            removeLoadingIndicator();
            
            const errorElement = document.createElement('div');
            errorElement.className = 'error-message';
            errorElement.textContent = message;
            chatContainer.appendChild(errorElement);
            scrollToBottom();
            
            // Remove error message after 5 seconds
            setTimeout(() => {
                errorElement.remove();
            }, 5000);
        }

        // Add chat to history sidebar
        function addChatToHistory(title) {
            const chatItem = document.createElement('div');
            chatItem.className = 'chat-item active';
            chatItem.dataset.id = conversationId;
            chatItem.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>${title}</span>
            `;
            
            // Remove active class from all items
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            
            chatHistory.prepend(chatItem);
            
            // Store chat data
            chatHistoryList.unshift({
                id: conversationId,
                title: title,
                messages: [...messageHistory]
            });
            
            // Save to local storage
            saveChatsToLocalStorage();
        }

        // Save chats to local storage
        function saveChatsToLocalStorage() {
            localStorage.setItem('sre-assistant-chats', JSON.stringify(chatHistoryList));
        }

        // Load chats from local storage
        function loadChatsFromLocalStorage() {
            const savedChats = localStorage.getItem('sre-assistant-chats');
            if (savedChats) {
                chatHistoryList = JSON.parse(savedChats);
                
                // Add chats to sidebar
                chatHistoryList.forEach(chat => {
                    const chatItem = document.createElement('div');
                    chatItem.className = 'chat-item';
                    chatItem.dataset.id = chat.id;
                    chatItem.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>${chat.title}</span>
                    `;
                    chatHistory.appendChild(chatItem);
                });
            }
        }

        // Setup copy buttons for code blocks
        function setupCopyButtons() {
            document.querySelectorAll('.copy-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const preElement = this.previousElementSibling;
                    const codeContent = preElement.textContent;
                    
                    navigator.clipboard.writeText(codeContent).then(() => {
                        // Change button text temporarily
                        const originalText = this.textContent;
                        this.textContent = 'Copied!';
                        setTimeout(() => {
                            this.textContent = originalText;
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy: ', err);
                    });
                });
            });
        }

        // Create a new chat
        function createNewChat() {
            conversationId = generateId();
            messageHistory = [];
            
            // Update UI
            chatContainer.innerHTML = `
                <div class="welcome-container">
                    <h1 class="welcome-title">SRE Assistant</h1>
                    <p class="welcome-subtitle">Your DevOps automation and scripting expert</p>
                    <p>Ask me to create Python or Bash scripts for your SRE and DevOps workflows. I can help with monitoring, automation, deployment, and more.</p>
                    <div class="example-queries">
                        <button class="example-query">Create a bash script to monitor CPU and memory usage on Linux servers</button>
                        <button class="example-query">Write a Python script to automate AWS EC2 instance backups</button>
                        <button class="example-query">Generate a Kubernetes pod health check script</button>
                        <button class="example-query">Create a Docker container cleanup script for stale images</button>
                    </div>
                </div>
            `;
            
            // Remove active class from all chat items
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // Setup example queries again
            setupExampleQueries();
            
            // Close mobile sidebar
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        }

        // Send message to API
        async function sendMessage(message) {
            if (isGenerating || !message.trim()) return;
            
            isGenerating = true;
            sendBtn.disabled = true;
            
            // Update UI
            addUserMessage(message);
            addLoadingIndicator();
            
            // Check if this is the first message in a new chat
            const isFirstMessage = messageHistory.length === 1;
            
            // Add chat to history if it's the first message
            if (isFirstMessage) {
                const title = message.length > 30 ? message.substring(0, 30) + '...' : message;
                addChatToHistory(title);
            }
            
            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_TOKEN}`
                    },
                    body: JSON.stringify({
                        messages: messageHistory,
                        max_tokens: 2048
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }
                
                const data = await response.json();
                removeLoadingIndicator();
                
                // Check if the response contains what we expect
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const assistantMessage = data.choices[0].message.content;
                    addAssistantMessage(assistantMessage);
                } else {
                    throw new Error('Invalid response format from API');
                }
                
                // Save updated chat to local storage
                saveChatsToLocalStorage();
                
            } catch (error) {
                console.error('Error calling API:', error);
                showError('Error generating response. Please try again.');
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            // Send button click
