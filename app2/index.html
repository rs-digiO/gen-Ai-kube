<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everything Kubernetes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('https://source.unsplash.com/1600x900/?cloud,technology') no-repeat center center/cover;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            text-align: left;
            overflow-y: auto;
            height: 80vh;
        }
        h1 {
            font-size: 2rem;
            text-align: center;
        }
        .chat-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user {
            background-color: #007bff;
            align-self: flex-end;
            text-align: right;
        }
        .bot {
            background-color: #333;
            align-self: flex-start;
            text-align: left;
        }
        .input-box {
            display: flex;
            margin-top: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            margin-left: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Everything Kubernetes</h1>
        <div class="chat-box" id="chat-box"></div>
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const API_ENDPOINT = "https://agent-b2ec4ee9b8083607363a-6vmxn.ondigitalocean.app/api/v1/chat/completions";
        const ACCESS_KEY = "HGEe750fPIVqiLNMjDN0frELWEYDvjFx"; // Replace with your actual key

        async function sendMessage() {
            const userInput = document.getElementById("user-input").value;
            if (!userInput.trim()) return;
            
            const chatBox = document.getElementById("chat-box");
            
            // Display user message
            const userMessage = document.createElement("div");
            userMessage.className = "message user";
            userMessage.textContent = userInput;
            chatBox.appendChild(userMessage);

            document.getElementById("user-input").value = ""; // Clear input

            // API Request
            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${ACCESS_KEY}`
                    },
                    body: JSON.stringify({
                        messages: [{ role: "user", content: userInput }],
                        stream: false,
                        include_functions_info: false,
                        include_retrieval_info: false,
                        include_guardrails_info: false
                    })
                });

                const data = await response.json();

                // Display bot response
                const botMessage = document.createElement("div");

                if (data.choices[0].message.content.includes("```")) {
                    const codeBlock = document.createElement("pre");
                    codeBlock.innerHTML = `<code>${data.choices[0].message.content.replace(/```/g, "").trim()}</code>`;
                    botMessage.appendChild(codeBlock);
                } else {
                    botMessage.textContent = data.choices[0].message.content || "Error: No response";
                }
                chatBox.appendChild(botMessage);
                chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to latest message
            } catch (error) {
                console.error("Error fetching response:", error);
            }
        }
    </script>

</body>
</html>
